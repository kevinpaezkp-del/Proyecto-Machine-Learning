name: Publicar presentación académica
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "robots.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código de la presentación
        uses: actions/checkout@v4
      - name: Preparar archivos públicos
        run: |
          set -e
          mkdir -p public/assets
          cp index.html public/index.html
          cp assets/site.css assets/site.js public/assets/
          cp robots.txt public/robots.txt
          touch public/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir la presentación
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Desplegar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
